[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=src/python
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    --verbose
    --tb=short
markers =
    integration: marks tests as integration tests (may be slow)
    performance: marks tests as performance benchmarks
    fault_tolerance: marks tests as fault tolerance scenarios
    ml_accuracy: marks tests as ML accuracy validation
